<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Medicine Box</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>💊 Smart Medicine Box</h1>
        <p>Smart medication management made simple.</p>
    </header>
    <main>
        <section class="dashboard">
            <div class="stat">
                <h2 id="total">0</h2>
                <p>Total Medicines</p>
            </div>
            <div class="stat">
                <h2 id="taken">0</h2>
                <p>Taken Today</p>
            </div>
            <div class="stat">
                <h2 id="upcoming">0</h2>
                <p>Upcoming</p>
            </div>
            <div class="stat">
                <h2 id="missed">0</h2>
                <p>Missed</p>
            </div>
        </section>

        <section class="card">
            <h2>➕ Add Medicine</h2>
            <form id="medicineForm">
                <input
                    type="text"
                    id="medicineName"
                    placeholder="Medicine name"
                    required
                >
                <input
                    type="text"
                    id="medicineDose"
                    placeholder="Dose e.g. 1 tablet"
                    required
                >
                <input
                    type="time"
                    id="medicineTime"
                    required
                >
                <button type="submit">
                    Add Medicine
                </button>
            </form>
        </section>

        <section class="card">
            <h2>📋 Today's Medications</h2>
            <div id="medicineList"></div>
            <div id="empty">
                <p>💊</p>
                <h3>No medicines added yet</h3>
                <p>Add your first medicine above.</p>
            </div>
        </section>
    </main>

    <footer>
        Smart Medicine Box © 2026
    </footer>

    <script src="script.js"></script>
</body>
</html>
